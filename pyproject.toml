[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-barcode-lookup"
version = "0.1.0"
description = "InvenTree plugin that resolves retail UPC/EAN barcodes against product databases and optionally auto-creates parts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "syntaxerr66"},
]
keywords = ["inventree", "barcode", "upc", "ean", "inventory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "requests",
]

[project.entry-points."inventree_plugins"]
RetailBarcodePlugin = "inventree_barcode_lookup.plugin:RetailBarcodePlugin"

[project.urls]
Homepage = "https://github.com/syntaxerr66/inventree-barcode-lookup"
Issues = "https://github.com/syntaxerr66/inventree-barcode-lookup/issues"

[tool.setuptools.packages.find]
include = ["inventree_barcode_lookup*"]
